<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="roseGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2f4" />
      <stop offset="35%" stop-color="#fae7eb" />
      <stop offset="70%" stop-color="#e2b4bd" />
      <stop offset="100%" stop-color="#a13e55" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f6d8df" />
      <stop offset="100%" stop-color="#c46b85" />
    </linearGradient>
    <radialGradient id="haloGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e2b4bd" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#a13e55" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0b080d" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Deep Obsidian Curved Base -->
  <rect width="100" height="100" rx="24" fill="#0e0a10" />
  
  <!-- Subtle Ambient Glow Behind Crest -->
  <circle cx="50" cy="50" r="44" fill="url(#haloGlow)" />

  <!-- Outer Fine Hairline Ring -->
  <circle cx="50" cy="50" r="41" fill="none" stroke="url(#roseGold)" stroke-width="1.2" stroke-opacity="0.6" stroke-dasharray="80 3" />
  <circle cx="50" cy="50" r="45" fill="none" stroke="url(#roseGold)" stroke-width="0.75" stroke-opacity="0.3" />

  <!-- Micro Celestial Accent Diamonds -->
  <polygon points="50,6 51.5,9 50,12 48.5,9" fill="url(#roseGold)" />
  <polygon points="50,88 51.5,91 50,94 48.5,91" fill="url(#roseGold)" />
  <polygon points="6,50 9,51.5 12,50 9,48.5" fill="url(#roseGold)" />
  <polygon points="88,50 91,51.5 94,50 91,48.5" fill="url(#roseGold)" />

  <!-- The Interlocking Sculptural "S" Motif -->
  <!-- Top Curve of "S" with Serif Droplet -->
  <path d="M64 29 C56 21 40 23 35 31 C30 39 36 47 48 51 C61 55 68 61 64 72 C60 83 43 82 34 76 C31 74 30 71 31 69 C32 67 34 67 36 68 C43 73 57 75 60 68 C63 61 58 57 46 53 C33 49 26 41 30 31 C34 21 48 18 61 24 C64 25 65 27 64 29 Z" 
        fill="url(#roseGold)" />

  <!-- Central Radiant Star / Diamond Glow Flare -->
  <g transform="translate(62, 36)">
    <!-- 8-Point Radiant Glow Flare -->
    <path d="M0,-12 Q0,0 12,0 Q0,0 0,12 Q0,0 -12,0 Q0,0 0,-12 Z" fill="url(#goldAccent)" />
    <!-- Diagonal Subtle Rays -->
    <path d="M-6,-6 L6,6 M-6,6 L6,-6" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.7" />
    <circle cx="0" cy="0" r="2" fill="#ffffff" />
  </g>
</svg>
